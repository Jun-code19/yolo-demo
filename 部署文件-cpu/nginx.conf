server {
    listen 80;
    server_name localhost;

    client_max_body_size 2G;  

    # 前端资源
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 代理检测服务API请求
    location /api/v2/ {
        proxy_pass http://detect-server:8000/api/v2/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 代理WebSocket连接
    location /ws/ {
        proxy_pass http://detect-server:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # 人员搜索（ReID 在 detect-server）
    location /api/v1/person-search/ {
        proxy_pass http://detect-server:8000/api/v1/person-search/;
        client_max_body_size 50M;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 人员抠图等静态文件（detect-server 挂载 storage）
    location /storage/ {
        proxy_pass http://detect-server:8000/storage/;
        proxy_set_header Host $host;
    }

    # 代理数据服务API请求
    location /api/v1/ {
        proxy_pass http://data-server:8001/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

} 